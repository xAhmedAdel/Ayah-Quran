# JVM arguments for the Gradle daemon. 4 GB is enough for this project size
# (single :app module, KSP for Room + Hilt).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required for all AndroidX libraries.
android.useAndroidX=true

# Generate non-transitive R classes: faster builds, smaller R classes.
android.nonTransitiveRClass=true

# Official Kotlin code style.
kotlin.code.style=official
