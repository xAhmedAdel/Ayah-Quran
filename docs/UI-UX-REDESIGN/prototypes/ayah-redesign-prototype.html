<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayah Redesign — Interactive UI Prototype (Al-Mushaf Al-Hadith)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F2E9;
  --surface: #FCF9F2;
  --surface-low: #FAF7EF;
  --surface-container: #F3EFE4;
  --surface-high: #ECE7DA;
  --surface-highest: #E4DEC0;
  --surface-lowest: #FFFFFF;
  --primary: #0F3D32;
  --on-primary: #FAF7F0;
  --primary-container: #DCEAE4;
  --on-primary-container: #0A2921;
  --secondary: #8F6E2A;
  --secondary-container: #F2E5C6;
  --on-secondary-container: #43320E;
  --text: #151C18;
  --text-muted: #525C56;
  --outline: #838D87;
  --outline-variant: #DDD7CA;
  --hero-bg: #0F3D32;
  --hero-bg-end: #0A2921;
  --hero-text: #F9F5EB;
  --hero-accent: #DFC178;
  --hero-muted: #B7CEC6;
  --mushaf-bg: #FBF7EE;
  --mushaf-highlight: rgba(196, 160, 82, 0.22);
  --mushaf-marker: #9A762D;
  --success: #1C6B4E;
  --success-bg: #E1F2EB;
  --warn: #9E6310;
  --warn-bg: #FBF0DC;
  --error: #B33A3A;
  --error-bg: #FBE8E8;
  --font-ui: 'IBM Plex Sans Arabic', 'Inter', system-ui, -apple-system, sans-serif;
  --font-quran: 'Amiri', Georgia, serif;
  --studio-bg: #E8E3D9;
  --studio-bar: #FAF7F0;
  --studio-border: #D5CEBF;
}
[data-theme="dark"] {
  --bg: #0C1210;
  --surface: #131B17;
  --surface-low: #111815;
  --surface-container: #161F1B;
  --surface-high: #1D2722;
  --surface-highest: #25312B;
  --surface-lowest: #090E0C;
  --primary: #D6B66B;
  --on-primary: #16201B;
  --primary-container: #1B3B31;
  --on-primary-container: #E6D29E;
  --secondary: #E2C887;
  --secondary-container: #3A2F16;
  --on-secondary-container: #F4E5BF;
  --text: #F2EEE5;
  --text-muted: #A7B2AC;
  --outline: #6F7A74;
  --outline-variant: #24302A;
  --hero-bg: #122D25;
  --hero-bg-end: #0B1D17;
  --hero-text: #F5F1E8;
  --hero-accent: #DFC178;
  --hero-muted: #A5BEB5;
  --mushaf-bg: #101613;
  --mushaf-highlight: rgba(214, 182, 107, 0.20);
  --mushaf-marker: #D6B66B;
  --success: #68C79F;
  --success-bg: #143327;
  --warn: #EBB45B;
  --warn-bg: #362812;
  --error: #F08A8A;
  --error-bg: #441B1B;
  --studio-bg: #070B09;
  --studio-bar: #111815;
  --studio-border: #232F29;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-ui);
  background: var(--studio-bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.2s ease, color 0.2s ease;
}
.tnum { font-variant-numeric: tabular-nums; }
.ltr-iso { unicode-bidi: isolate; direction: ltr; display: inline-block; }
.studio-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--studio-bar);
  border-bottom: 1px solid var(--studio-border);
  padding: 12px 24px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.studio-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.studio-brand h1 {
  font-family: var(--font-quran);
  font-size: 26px;
  color: var(--primary);
  line-height: 1;
}
.studio-brand span {
  font-size: 13px;
  color: var(--text-muted);
  border-inline-start: 1px solid var(--outline-variant);
  padding-inline-start: 12px;
}
.studio-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.ctrl-group {
  display: inline-flex;
  background: var(--surface-container);
  border: 1px solid var(--outline-variant);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.ctrl-btn {
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-family: var(--font-ui);
  font-size: 12.5px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.ctrl-btn.active {
  background: var(--primary);
  color: var(--on-primary);
}
.screen-pills {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  padding: 14px 20px 4px;
}
.screen-pill {
  border: 1px solid var(--outline-variant);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.screen-pill.active {
  background: var(--primary);
  color: var(--on-primary);
  border-color: var(--primary);
}
.stage {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px 24px 48px;
  gap: 28px;
  flex-wrap: wrap;
}
.phone-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.phone-caption {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
}
.phone {
  width: 390px;
  height: 820px;
  background: var(--bg);
  border-radius: 40px;
  border: 8px solid #1C221F;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}
.status-bar {
  height: 36px;
  padding: 0 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  flex-shrink: 0;
  direction: ltr;
}
.status-icons {
  display: flex;
  align-items: center;
  gap: 6px;
}
.screen-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 4px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scrollbar-width: thin;
}
.screen-body.mushaf-mode {
  background: var(--mushaf-bg);
  padding: 0;
  gap: 0;
}
.screen-body.studio-mode {
  padding: 0;
  gap: 0;
  overflow: hidden;
}
.topbar {
  height: 52px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  background: var(--bg);
}
.topbar.mushaf-top {
  background: var(--mushaf-bg);
  border-bottom: 1px solid var(--outline-variant);
}
.topbar-title {
  font-size: 19px;
  font-weight: 600;
  color: var(--text);
}
.topbar-sub {
  font-size: 12px;
  color: var(--text-muted);
}
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s ease;
}
.icon-btn:hover { background: var(--surface-high); }
.icon-btn.tonal {
  background: var(--surface-container);
  border: 1px solid var(--outline-variant);
}
.icon-btn.primary {
  background: var(--primary);
  color: var(--on-primary);
}
.card {
  background: var(--surface);
  border: 1px solid var(--outline-variant);
  border-radius: 16px;
  padding: 16px;
}
.hero-card {
  background: linear-gradient(155deg, var(--hero-bg) 0%, var(--hero-bg-end) 100%);
  border: 1px solid rgba(223, 193, 120, 0.26);
  border-radius: 22px;
  padding: 20px;
  color: var(--hero-text);
  position: relative;
  overflow: hidden;
}
.hero-card::after {
  content: '';
  position: absolute;
  inset: 7px;
  border: 1px solid rgba(223, 193, 120, 0.14);
  border-radius: 16px;
  pointer-events: none;
}
.banner-warn {
  background: var(--warn-bg);
  border: 1px solid rgba(158, 99, 16, 0.22);
  border-radius: 14px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 12.5px;
  color: var(--warn);
}
.pill-btn {
  border: none;
  border-radius: 999px;
  padding: 9px 16px;
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: opacity 0.15s ease;
}
.pill-btn.primary { background: var(--primary); color: var(--on-primary); }
.pill-btn.hero { background: var(--hero-accent); color: #17201B; }
.pill-btn.tonal { background: var(--primary-container); color: var(--on-primary-container); }
.pill-btn.outlined { background: transparent; border: 1px solid var(--outline-variant); color: var(--text); }
.pill-btn.sm { padding: 6px 12px; font-size: 12px; }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
}
.badge.success { background: var(--success-bg); color: var(--success); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.gold { background: var(--secondary-container); color: var(--on-secondary-container); }
.badge.hero { background: rgba(223, 193, 120, 0.16); color: var(--hero-accent); }
.progress-track {
  height: 5px;
  border-radius: 999px;
  background: var(--surface-highest);
  overflow: hidden;
  width: 100%;
}
.progress-track.hero { background: rgba(255, 255, 255, 0.16); }
.progress-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--primary);
}
.progress-fill.hero { background: var(--hero-accent); }
.section-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-muted);
  padding: 2px 2px 0;
}
.search-pill {
  height: 44px;
  background: var(--surface-container);
  border: 1px solid var(--outline-variant);
  border-radius: 999px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-muted);
  font-size: 13.5px;
}
.search-pill input {
  border: none;
  background: transparent;
  outline: none;
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13.5px;
  flex: 1;
}
.seg-row {
  display: flex;
  background: var(--surface-container);
  border: 1px solid var(--outline-variant);
  border-radius: 12px;
  padding: 3px;
  gap: 3px;
}
.seg-btn {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 600;
  padding: 8px 6px;
  border-radius: 9px;
  cursor: pointer;
}
.seg-btn.active {
  background: var(--surface-lowest);
  color: var(--primary);
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}
[data-theme="dark"] .seg-btn.active {
  background: var(--primary-container);
  color: var(--on-primary-container);
}
.surah-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--outline-variant);
  cursor: pointer;
}
.surah-row:last-child { border-bottom: none; }
.rosette {
  width: 38px;
  height: 38px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
}
.rosette svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.mushaf-banner {
  margin: 14px 16px 10px;
  padding: 10px 16px;
  background: var(--primary-container);
  border-top: 1.5px solid var(--mushaf-marker);
  border-bottom: 1.5px solid var(--mushaf-marker);
  border-radius: 6px;
  text-align: center;
  font-family: var(--font-quran);
  font-size: 26px;
  font-weight: 700;
  color: var(--on-primary-container);
}
.mushaf-text {
  padding: 8px 20px 20px;
  font-family: var(--font-quran);
  font-size: 23.5px;
  line-height: 2.12;
  text-align: justify;
  direction: rtl;
  color: var(--text);
}
.ayah-span {
  border-radius: 6px;
  padding: 1px 3px;
  cursor: pointer;
  transition: background 0.15s ease;
}
.ayah-span.selected {
  background: var(--mushaf-highlight);
}
.ayah-marker {
  color: var(--mushaf-marker);
  font-size: 18px;
  margin: 0 3px;
}
.ayah-action-pill {
  margin: 0 14px 8px;
  background: var(--surface-high);
  border: 1px solid var(--outline-variant);
  border-radius: 999px;
  padding: 6px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.12);
}
.reader-bottom-bar {
  height: 52px;
  padding: 0 16px;
  background: var(--mushaf-bg);
  border-top: 1px solid var(--outline-variant);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.mini-player {
  margin: 0 10px 6px;
  background: var(--surface-high);
  border: 1px solid var(--outline-variant);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  cursor: pointer;
  flex-shrink: 0;
}
.mini-player-line {
  height: 2.5px;
  background: var(--surface-highest);
}
.mini-player-line-fill {
  height: 100%;
  width: 58%;
  background: var(--primary);
}
.mini-player-inner {
  padding: 9px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.bottom-nav {
  height: 68px;
  background: var(--surface-container);
  border-top: 1px solid var(--outline-variant);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 4px 6px 8px;
  flex-shrink: 0;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-family: var(--font-ui);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
}
.nav-pill {
  width: 52px;
  height: 28px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease;
}
.nav-item.active { color: var(--primary); font-weight: 700; }
.nav-item.active .nav-pill { background: var(--secondary-container); color: var(--on-secondary-container); }
.reciter-strip {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.reciter-card {
  min-width: 146px;
  padding: 12px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--outline-variant);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.reciter-card.active {
  background: var(--primary-container);
  border-color: var(--primary);
}
.prayer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 12px;
  border-radius: 12px;
}
.prayer-row.next {
  background: var(--primary-container);
  color: var(--on-primary-container);
  font-weight: 700;
}
.wp-stage {
  padding: 10px 16px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: var(--surface-low);
  border-bottom: 1px solid var(--outline-variant);
  flex-shrink: 0;
}
.wp-preview {
  width: 152px;
  height: 274px;
  border-radius: 22px;
  border: 3px solid var(--outline-variant);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 18px 14px;
  text-align: center;
  position: relative;
  transition: all 0.2s ease;
}
.wp-preview::before {
  content: '';
  position: absolute;
  inset: 9px;
  border: 1px solid rgba(213, 181, 106, 0.45);
  border-radius: 14px;
  pointer-events: none;
}
.wp-swatch-row {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 4px 0;
}
.wp-swatch {
  min-width: 68px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.wp-swatch-box {
  width: 58px;
  height: 76px;
  border-radius: 12px;
  border: 2px solid transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-quran);
  font-size: 16px;
}
.wp-swatch.active .wp-swatch-box {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-container);
}
.setting-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--outline-variant);
  cursor: pointer;
}
.setting-row:last-child { border-bottom: none; }
.setting-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--surface-container);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.theme-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.theme-card {
  border: 1.5px solid var(--outline-variant);
  border-radius: 14px;
  padding: 10px 6px;
  text-align: center;
  cursor: pointer;
  background: var(--surface);
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.theme-card.active {
  border-color: var(--primary);
  background: var(--primary-container);
  color: var(--on-primary-container);
}
.mini-ui-thumb {
  width: 52px;
  height: 34px;
  border-radius: 7px;
  border: 1px solid var(--outline-variant);
  overflow: hidden;
  display: flex;
}
.medallion {
  width: 176px;
  height: 176px;
  margin: 8px auto 4px;
  border-radius: 50%;
  background: linear-gradient(155deg, var(--hero-bg) 0%, var(--hero-bg-end) 100%);
  border: 2px solid rgba(223, 193, 120, 0.45);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--hero-text);
  box-shadow: 0 12px 28px rgba(15, 61, 50, 0.22);
}
.chip-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  border: 1px solid var(--outline-variant);
  background: var(--surface);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
.chip.active {
  background: var(--secondary-container);
  border-color: var(--secondary);
  color: var(--on-secondary-container);
  font-weight: 600;
}
.toast {
  position: absolute;
  bottom: 84px;
  left: 16px;
  right: 16px;
  background: var(--primary);
  color: var(--on-primary);
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 12.5px;
  font-weight: 600;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  z-index: 50;
}
</style>
</head>
<body>
<header class="studio-header">
  <div class="studio-brand">
    <h1>آية</h1>
    <span id="studioSubtitle">النظام التصميمي المقترح: المصحف الحديث — نموذج تفاعلي</span>
  </div>
  <div class="studio-controls">
    <div class="ctrl-group">
      <button class="ctrl-btn active" id="btnViewSingle" onclick="setViewMode('single')">Interactive Phone</button>
      <button class="ctrl-btn" id="btnViewAll" onclick="setViewMode('all')">All 8 Screens</button>
    </div>
    <div class="ctrl-group">
      <button class="ctrl-btn active" id="btnLangAr" onclick="setLang('ar')">العربية RTL</button>
      <button class="ctrl-btn" id="btnLangEn" onclick="setLang('en')">English LTR</button>

function showToast(msg) {
  state.toastMsg = msg;
  render();
  setTimeout(() => { state.toastMsg = null; render(); }, 2200);
}

function setLang(l) {
  state.lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('btnLangAr').classList.toggle('active', l === 'ar');
  document.getElementById('btnLangEn').classList.toggle('active', l === 'en');
  render();
}

function setTheme(th) {
  state.theme = th;
  document.documentElement.setAttribute('data-theme', th);
  document.getElementById('btnThemeLight').classList.toggle('active', th === 'light');
  document.getElementById('btnThemeDark').classList.toggle('active', th === 'dark');
  render();
}

function setViewMode(m) {
  state.viewMode = m;
  document.getElementById('btnViewSingle').classList.toggle('active', m === 'single');
  document.getElementById('btnViewAll').classList.toggle('active', m === 'all');
  render();
}

function go(screenId) {
  state.screen = screenId;
  if (state.viewMode === 'all') setViewMode('single');
  else render();
}

}

        <div class="progress-track hero"><div class="progress-fill hero" style="width:68%;"></div></div>
      </div>

      <div class="card" style="padding:10px;">
        ${prayers.map(p => `
          <div class="prayer-row ${p.next ? 'next' : ''}" onclick="showToast('${isAr ? 'تعديل نمط أذان ' + p.ar : 'Configure ' + p.en + ' Adhan'}')" style="cursor:pointer;">
            <div style="display:flex;align-items:center;gap:10px;">
              <span style="font-family:var(--font-quran);font-size:19px;">${isAr ? p.ar : p.en}</span>
              ${p.next ? `<span class="badge gold">${t.upcoming}</span>` : ''}
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <span style="font-size:16px;font-weight:600;" class="tnum ltr-iso">${p.time}</span>
              <span style="color:${p.next ? 'var(--on-primary-container)' : 'var(--primary)'};">${icons.bell}</span>
            </div>
          </div>
        `).join('')}
        <div style="border-top:1px solid var(--outline-variant);margin:6px 8px;padding-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-muted);">
          <div>
            <div style="font-weight:600;">${t.sunrise}</div>
            <div style="font-size:11px;">${t.sunriseNote}</div>
          </div>
          <span class="tnum ltr-iso">06:26</span>
        </div>
      </div>

      <div class="banner-warn">
        <span style="flex:1;">${t.reliabilityNote}</span>
        <button class="pill-btn sm primary" onclick="showToast('${isAr ? 'فتح إعدادات الموثوقية' : 'Opening reliability settings'}')">${t.reviewSetup}</button>
      </div>
    </div>
    ${renderMiniPlayer(t)}
    ${renderBottomNav('prayer', t)}
  `;
}

function renderWallpapers(t) {
  const isAr = state.lang === 'ar';
  const tpl = wpTemplates.find(x => x.id === state.wpTemplate) || wpTemplates[0];
  let tabContent = '';
  if (state.wpTab === 'style') {
    tabContent = `
      <div class="wp-swatch-row">
        ${wpTemplates.map(w => `
          <div class="wp-swatch ${state.wpTemplate === w.id ? 'active' : ''}" onclick="state.wpTemplate='${w.id}';render()">
            <div class="wp-swatch-box" style="background:${w.bg};color:${w.text};">آية</div>
            <span style="font-size:11.5px;color:var(--text-muted);font-weight:${state.wpTemplate === w.id ? '700' : '500'};">${isAr ? w.ar : w.en}</span>
          </div>
        `).join('')}
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:8px;">
        <span style="font-size:12px;color:var(--text-muted);">${isAr ? 'الحجم' : 'Size'}</span>
        <input type="range" min="15" max="24" value="${state.wpFontSize}" oninput="state.wpFontSize=Number(this.value);render()" style="flex:1;accent-color:var(--primary);" />
        <span style="font-size:12px;font-weight:600;" class="tnum">${state.wpFontSize}sp</span>
      </div>
    `;
  } else if (state.wpTab === 'verse') {
    tabContent = `
      <div class="chip-wrap">
        <button class="chip active">${isAr ? 'آية يومية' : 'Daily Ayah'}</button>
        <button class="chip">${isAr ? 'عشوائي' : 'Random'}</button>
        <button class="chip">${isAr ? 'من سورة محددة' : 'From Surah'}</button>
        <button class="chip">${isAr ? 'تسلسلي' : 'Sequential'}</button>
      </div>
      <div style="margin-top:10px;font-size:12.5px;color:var(--text-muted);">${isAr ? 'السورة: طه (٢٠) · الآية ١١٤' : 'Surah: Ta-Ha (20) · Ayah 114'}</div>
    `;
  } else if (state.wpTab === 'auto') {
    tabContent = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-size:13.5px;font-weight:600;">${t.wallpaperAuto}</span>
        <span class="badge success">${isAr ? 'مفعّل' : 'Active'}</span>
      </div>
      <div class="chip-wrap">
        <button class="chip">30m</button><button class="chip">1h</button><button class="chip">3h</button><button class="chip active">6h</button><button class="chip">12h</button><button class="chip">24h</button>
      </div>
    `;
  } else {
    tabContent = `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;">
        <div>
          <div style="font-size:13.5px;font-weight:600;">${t.wallpaperRef}</div>
          <div style="font-size:11.5px;color:var(--text-muted);">${isAr ? 'اليوم · كلاهما · نجح' : 'Today · Both · Success'}</div>
        </div>
        <button class="pill-btn sm tonal" onclick="showToast('${t.wpApplied}')">${isAr ? 'إعادة تطبيق' : 'Reapply'}</button>
      </div>
    `;
  }

  return `
    <div class="topbar">
      <div class="topbar-title">${t.wpTitle}</div>
      <span class="badge gold">${t.wallpaperAuto}</span>
    </div>
    <div class="screen-body studio-mode">
      <div class="wp-stage">
        <button class="icon-btn tonal" onclick="showToast('${isAr ? 'تم تبديل الآية' : 'Verse shuffled'}')">${icons.shuffle}</button>
        <div class="wp-preview" style="background:${tpl.bg};color:${tpl.text};">
          <div style="font-family:var(--font-quran);font-size:${state.wpFontSize}px;line-height:1.75;direction:rtl;">وَقُل رَّبِّ زِدْنِي عِلْمًا</div>
          <div style="font-size:10px;color:${tpl.ref};margin-top:10px;">${isAr ? 'طه · ٢٠:١١٤' : 'Ta-Ha · 20:114'}</div>
        </div>
        <button class="icon-btn tonal" onclick="showToast('${isAr ? 'معاينة ملء الشاشة' : 'Fullscreen preview'}')">${icons.expand}</button>
      </div>

      <div style="flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:10px;">
        <div class="seg-row">
          ${[['style', t.wpStyle], ['verse', t.wpVerse], ['auto', t.wpAuto], ['history', t.wpHistory]].map(([k, lbl]) => `
            <button class="seg-btn ${state.wpTab === k ? 'active' : ''}" onclick="state.wpTab='${k}';render()">${lbl}</button>
          `).join('')}
        </div>
        <div class="card" style="padding:12px;">${tabContent}</div>
      </div>

      <div style="padding:8px 16px 10px;border-top:1px solid var(--outline-variant);background:var(--surface);display:flex;flex-direction:column;gap:8px;flex-shrink:0;">
        <div class="seg-row">
          ${[['home', t.destHome], ['lock', t.destLock], ['both', t.destBoth]].map(([k, lbl]) => `
            <button class="seg-btn ${state.wpDest === k ? 'active' : ''}" style="padding:6px;" onclick="state.wpDest='${k}';render()">${lbl}</button>
          `).join('')}
        </div>
        <button class="pill-btn primary" style="width:100%;" onclick="showToast('${t.wpApplied}')">${t.applyWp}</button>
      </div>
    </div>
    ${renderBottomNav('wallpapers', t)}
  `;
}

function renderSettings(t) {
  const isAr = state.lang === 'ar';
  return `
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="icon-btn" onclick="go('home')">${isAr ? icons.backRtl : icons.back}</button>
        <div class="topbar-title">${t.settingsTitle}</div>
      </div>
    </div>
    <div class="screen-body">
      <div class="section-hdr"><span>${t.appearance}</span></div>
      <div class="theme-cards">
        <div class="theme-card" onclick="setTheme('light')">
          <div class="mini-ui-thumb"><div style="flex:1;background:#F6F2E9;"></div><div style="flex:1;background:#0C1210;"></div></div>
          <span>${t.themeSystem}</span>
        </div>
        <div class="theme-card ${state.theme === 'light' ? 'active' : ''}" onclick="setTheme('light')">
          <div class="mini-ui-thumb" style="background:#F6F2E9;padding:5px;"><div style="width:100%;height:10px;border-radius:3px;background:#0F3D32;"></div></div>
          <span>${t.themeLight}</span>
        </div>
        <div class="theme-card ${state.theme === 'dark' ? 'active' : ''}" onclick="setTheme('dark')">
          <div class="mini-ui-thumb" style="background:#0C1210;padding:5px;"><div style="width:100%;height:10px;border-radius:3px;background:#D6B66B;"></div></div>
          <span>${t.themeDark}</span>
        </div>
      </div>

      <div class="section-hdr"><span>${t.language}</span></div>
      <div class="seg-row">
        <button class="seg-btn ${isAr ? 'active' : ''}" onclick="setLang('ar')">العربية</button>
        <button class="seg-btn ${!isAr ? 'active' : ''}" onclick="setLang('en')">English</button>
      </div>

      <div class="section-hdr"><span>${t.prefsTitle}</span></div>
      <div class="card" style="padding:0;">
        <div class="setting-row" onclick="go('reader')">
          <div class="setting-icon">${icons.quran}</div>
          <div style="flex:1;"><div style="font-size:14px;font-weight:600;">${t.prefReading}</div><div style="font-size:12px;color:var(--text-muted);">${t.prefReadingSub}</div></div>
        </div>
        <div class="setting-row" onclick="go('audio')">
          <div class="setting-icon">${icons.audio}</div>
          <div style="flex:1;"><div style="font-size:14px;font-weight:600;">${t.prefAudio}</div><div style="font-size:12px;color:var(--text-muted);">${t.prefAudioSub}</div></div>
        </div>
        <div class="setting-row" onclick="go('prayer')">
          <div class="setting-icon">${icons.prayer}</div>
          <div style="flex:1;"><div style="font-size:14px;font-weight:600;">${t.prefPrayer}</div><div style="font-size:12px;color:var(--text-muted);">${t.prefPrayerSub}</div></div>
        </div>
        <div class="setting-row" onclick="showToast('${t.prefUpdatesSub}')">
          <div class="setting-icon">${icons.download}</div>
          <div style="flex:1;"><div style="font-size:14px;font-weight:600;">${t.prefUpdates}</div><div style="font-size:12px;color:var(--success);">${t.prefUpdatesSub}</div></div>
        </div>
      </div>

      <div class="section-hdr"><span>${t.aboutTitle}</span></div>
      <div class="card" style="padding:0;">
        <div class="setting-row" style="cursor:default;">
          <div style="flex:1;font-size:14px;font-weight:600;">${t.versionLbl}</div>
          <div style="font-size:13.5px;color:var(--text-muted);" class="ltr-iso tnum">1.0.0-beta.6</div>
        </div>
        <div class="setting-row" onclick="showToast('Tanzil Uthmani CC-BY 3.0 · Amiri SIL OFL 1.1 · Wikimedia · GeoNames')">
          <div style="flex:1;font-size:14px;font-weight:600;">${t.licensesLbl}</div>
          <span style="font-size:12px;color:var(--primary);font-weight:600;">${isAr ? 'عرض' : 'View'}</span>
        </div>
      </div>
    </div>
    ${renderMiniPlayer(t)}
  `;
}

function renderScreenContent(id, t) {
  switch (id) {
    case 'home': return renderHome(t);
    case 'quran': return renderQuran(t);
    case 'reader': return renderReader(t);
    case 'audio': return renderAudio(t);
    case 'nowplaying': return renderNowPlaying(t);
    case 'prayer': return renderPrayer(t);
    case 'wallpapers': return renderWallpapers(t);
    case 'settings': return renderSettings(t);
    default: return renderHome(t);
  }
}

function render() {
  const t = T[state.lang];
  document.getElementById('studioSubtitle').textContent = t.subtitle;
  const screenOrder = ['home', 'quran', 'reader', 'audio', 'nowplaying', 'prayer', 'wallpapers', 'settings'];

  const pillsEl = document.getElementById('screenPills');
  pillsEl.style.display = state.viewMode === 'single' ? 'flex' : 'none';
  pillsEl.innerHTML = screenOrder.map(id => `
    <button class="screen-pill ${state.screen === id ? 'active' : ''}" onclick="go('${id}')">${t.screens[id]}</button>
  `).join('');

  const stage = document.getElementById('stage');
  const idsToRender = state.viewMode === 'single' ? [state.screen] : screenOrder;
  stage.innerHTML = idsToRender.map(id => `
    <div class="phone-wrap">
      ${state.viewMode === 'all' ? `<div class="phone-caption">${t.screens[id]}</div>` : ''}
      <div class="phone">
        ${renderStatusBar()}
        ${renderScreenContent(id, t)}
        ${state.toastMsg && (state.viewMode === 'single' || id === state.screen) ? `<div class="toast">${state.toastMsg}</div>` : ''}
      </div>
    </div>
  `).join('');
}

render();
</script>
</body>
</html>
